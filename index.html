<html lang="en">
<head>
    <title>Student Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="page-header">
        <h1>Student Admission Form</h1>
        <p>Please complete the form below to apply for addmission.</p>
    </header>

    <main>
        <form class="admission-form">

            <fieldset class="form-section">
                <legend>Personal Information</legend>

                <label for="fullName">Full Name:</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    minlength="3"
                    required
                >
                <br><br>

                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
                <br><br>

                <label for="phone">Phone Number:</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    pattern="03[0-9]{9}"
                    title="Enter an 11-digit Pakistani mobile number starting with 03."
                    placeholder="XXXX-XXXXXXX"
                >
                <br><br>

                <label for="age">Age:</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    min="16"
                    max="60"
                    required
                >
                <br><br>

                <label for="city">City:</label>
                <select id="city" name="city" required>
                    <option value="" selected disabled>
                        Select your city
                    </option>
                    <option value="islamabad">Islamabad</option>
                    <option value="rawalpindi">Rawalpindi</option>
                    <option value="lahore">Lahore</option>
                    <option value="karachi">Karachi</option>
                    <option value="peshawar">Peshawar</option>
                </select>
            </fieldset>

            <br>

            <fieldset class="form-section">
                <legend>Course Selection</legend>

                <label for="course">Choose Your Course:</label>
                <select id="course" name="course" required>
                    <option value="" selected disabled>
                        Select a course
                    </option>
                    <option value="web-development">
                        Web Development
                    </option>
                    <option value="graphic-design">
                        Graphic Design
                    </option>
                    <option value="digital-marketing">
                        Digital Marketing
                    </option>
                    <option value="artificial-intelligence">
                        Artificial Intelligence
                    </option>
                </select>
            </fieldset>

            <br>

            <fieldset class="form-section">
                <legend>Preferred Class Shift</legend>

                <input
                    type="radio"
                    id="morning"
                    name="shift"
                    value="morning"
                    required
                >
                <label for="morning">Morning</label>
                <br>

                <input
                    type="radio"
                    id="evening"
                    name="shift"
                    value="evening"
                >
                <label for="evening">Evening</label>
                <br>

                <input
                    type="radio"
                    id="weekend"
                    name="shift"
                    value="weekend"
                >
                <label for="weekend">Weekend</label>
            </fieldset>

            <br>

            <fieldset class="form-section">
                <legend>Current Skills (Optional)</legend>

                <input
                    type="checkbox"
                    id="html"
                    name="skills"
                    value="HTML"
                >
                <label for="html">HTML</label>
                <br>

                <input
                    type="checkbox"
                    id="css"
                    name="skills"
                    value="CSS">
                <label for="css">CSS</label>
                <br>

                <input
                    type="checkbox"
                    id="javascript"
                    name="skills"
                    value="JavaScript"
                >
                <label for="javascript">JavaScript</label>
                <br>

                <input
                    type="checkbox"
                    id="python"
                    name="skills"
                    value="Python">
                <label for="python">Python</label>
            </fieldset>

            <br>

            <fieldset class="form-section">
                <legend>Motivation  </legend>

                <label for="motivation">
                    Why do you want to join your preffered course?
                </label>
                <br>
          <textarea id="motivation"
                    name="motivation"
                    rows="5"
                    cols="40"
                    minlength="10"
                    maxlength="200"
                    required></textarea>
            </fieldset>

            <br>

            <fieldset class="form-section">
                <legend>Additional Information (Optional)</legend>

                <label for="portfolio">Portfolio Website URL:</label>
                <input
                    type="url"
                    id="portfolio"
                    name="portfolio"
                    placeholder="https://example.com">
                <br><br>

                <label for="startDate">Preferred Starting Date:</label>
                <input
                    type="date"
                    id="startDate"
                    name="startDate">
            </fieldset>

            <br>

            <button type="submit" class="submit-btn">
             Submit Application
            </button>
            <button type="reset" class="reset-btn">
             Clear Form
              </button>

        </form>
    </main>
   
           <footer class="page-footer">
    <p>Student Name: Eman Majid Abbasi</p>
    <p> Roll Number: 3131713 | Assignment 05 </p>
</footer>
</body>
</html>
